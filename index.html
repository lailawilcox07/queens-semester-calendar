<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semester Calendar · Queen's</title>
<meta name="description" content="A free semester planner for Queen's students: weekly calendar, deadlines, study plan and grades, all on your own device.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Semester">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="assets/favicon-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("qsc.theme"),m=localStorage.getItem("qsc.mode"),d=document.documentElement;if(t&&t!=="classic")d.setAttribute("data-theme",t);if(m&&m!=="auto")d.setAttribute("data-mode",m)}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <span class="brand"><img src="assets/logo-128.png" alt="" width="28" height="28">Semester Calendar</span>
    <div id="account"></div>
  </header>
  <main id="app" class="wrap" aria-live="polite"></main>
  <noscript><p class="wrap">Semester Calendar needs JavaScript turned on.</p></noscript>
  <input type="file" id="filePick" multiple hidden>
  <script src="js/theme.js"></script>
  <script src="js/config.js"></script>
  <script src="js/terms.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/store.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/push.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/install.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
